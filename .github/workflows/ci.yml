name: CI

on:
  push:
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  host-tests:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.4
    steps:
      - uses: actions/checkout@v7
      - name: Run host unit tests
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          scripts/host_test.sh

  config-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the config schema and example configs
        run: |
          pipx run check-jsonschema==0.38.2 --check-metaschema configs/node-config.schema.json
          pipx run check-jsonschema==0.38.2 --schemafile configs/node-config.schema.json configs/example-*.json

  hardware-build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.4
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history and tags for the git describe version
      - name: Build hardware firmware
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh" > /dev/null
          scripts/build.sh
      - name: Report firmware size
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          scripts/build.sh size
