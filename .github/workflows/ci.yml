name: CI

on:
  push:
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  host-tests:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.4
    steps:
      - uses: actions/checkout@v7
      - name: Run host unit tests
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          scripts/host_test.sh

  config-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the config schema and example configs
        run: |
          pipx run check-jsonschema==0.38.2 --check-metaschema configs/node-config.schema.json
          pipx run check-jsonschema==0.38.2 --schemafile configs/node-config.schema.json configs/example-*.json

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check C sources are clang-formatted
        run: |
          git ls-files -z '*.c' '*.h' '*.cpp' '*.hpp' '*.cc' \
            | xargs -0 pipx run clang-format==18.1.3 --dry-run --Werror

  tool-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the PC tools' packages
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r tools/requirements.txt
      - name: Build the PC config checker
        run: |
          cmake -S tools/node_config_check -B build/node_config_check
          cmake --build build/node_config_check
      - name: Check the example configs with the firmware parser
        run: |
          for config in configs/example-*.json; do
            .venv/bin/python tools/config_flash.py \
              --checker build/node_config_check/node_config_check check "$config"
          done
      - name: Run PC tool unit tests
        run: .venv/bin/pytest tools

  hardware-build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.4
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history and tags for the git describe version
      - name: Build hardware firmware
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh" > /dev/null
          scripts/build.sh
      - name: Report firmware size
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          scripts/build.sh size
